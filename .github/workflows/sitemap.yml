name: Validate sitemap

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run export-sitemap && npx sitemap-lint dist/sitemap.xml
